<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Xem trước video</title>
<style>
  @font-face { font-family: 'Patrick Hand'; src: url(fonts/PatrickHand-Regular.ttf); }
  @font-face { font-family: 'Pangolin'; src: url(fonts/Pangolin-Regular.ttf); }
  @font-face { font-family: 'Be Vietnam Pro'; font-weight: 500; src: url(fonts/BeVietnamPro-Medium.ttf); }
  @font-face { font-family: 'Be Vietnam Pro'; font-weight: 600; src: url(fonts/BeVietnamPro-SemiBold.ttf); }
  @font-face { font-family: 'Be Vietnam Pro'; font-weight: 800; src: url(fonts/BeVietnamPro-ExtraBold.ttf); }
  html, body { margin: 0; background: #1d1d1f; color: #ddd; font: 14px system-ui, sans-serif; }
  canvas { display: block; margin: 0 auto; max-width: 100vw; max-height: calc(100vh - 48px); cursor: pointer; }
  #bar { height: 10px; background: #333; cursor: pointer; margin: 8px 16px 4px; border-radius: 5px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #f6c344; pointer-events: none; }
  #info { padding: 0 16px; opacity: .75; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="bar"><div id="fill"></div></div>
<div id="info">Đang tải…</div>
<script type="module" src="player.js"></script>
</body>
</html>
